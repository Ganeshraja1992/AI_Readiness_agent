<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!-- circuit traces -->
  <g fill="none" stroke="#06b6d4" stroke-opacity="0.10" stroke-width="1.2">
    <path d="M0,60 H90 V140 H210"/>
    <path d="M210,140 V40 H340"/>
    <path d="M340,40 V0"/>
    <path d="M60,180 H60 V280 H160 V340"/>
    <path d="M300,220 H420 V300 H480"/>
    <path d="M120,400 H260 V480"/>
    <path d="M0,420 H40 V360 H140"/>
    <path d="M380,360 V440 H480"/>
    <path d="M220,240 H300"/>
  </g>

  <!-- neural network nodes + edges -->
  <g fill="none" stroke="#8b5cf6" stroke-opacity="0.18" stroke-width="1">
    <line x1="40" y1="70" x2="150" y2="110"/>
    <line x1="150" y1="110" x2="270" y2="60"/>
    <line x1="150" y1="110" x2="210" y2="220"/>
    <line x1="270" y1="60" x2="380" y2="120"/>
    <line x1="210" y1="220" x2="120" y2="290"/>
    <line x1="210" y1="220" x2="330" y2="260"/>
    <line x1="330" y1="260" x2="380" y2="120"/>
    <line x1="330" y1="260" x2="420" y2="360"/>
    <line x1="120" y1="290" x2="60" y2="380"/>
    <line x1="120" y1="290" x2="230" y2="400"/>
    <line x1="230" y1="400" x2="330" y2="260"/>
    <line x1="230" y1="400" x2="340" y2="440"/>
    <line x1="60" y1="380" x2="150" y2="460"/>
  </g>

  <g fill="#ec4899" fill-opacity="0.24">
    <circle cx="40" cy="70" r="2.5"/>
    <circle cx="380" cy="120" r="2.5"/>
    <circle cx="120" cy="290" r="2.5"/>
    <circle cx="420" cy="360" r="2.5"/>
    <circle cx="60" cy="380" r="2"/>
    <circle cx="340" cy="440" r="2"/>
    <circle cx="150" cy="460" r="2"/>
  </g>

  <g fill="#8b5cf6" fill-opacity="0.32">
    <circle cx="150" cy="110" r="3.5"/>
    <circle cx="270" cy="60" r="3"/>
    <circle cx="210" cy="220" r="4"/>
    <circle cx="330" cy="260" r="3.5"/>
    <circle cx="230" cy="400" r="3.5"/>
  </g>

  <g fill="#06b6d4" fill-opacity="0.35">
    <circle cx="90" cy="60" r="1.6"/>
    <circle cx="210" cy="140" r="1.6"/>
    <circle cx="340" cy="40" r="1.6"/>
    <circle cx="160" cy="280" r="1.6"/>
    <circle cx="420" cy="300" r="1.6"/>
    <circle cx="260" cy="400" r="1.6"/>
    <circle cx="140" cy="360" r="1.6"/>
  </g>
