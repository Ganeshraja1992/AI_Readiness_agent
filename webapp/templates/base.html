<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Readiness Agent{% endblock %}</title>
  <script>
    // Runs synchronously before first paint so the page never flashes the
    // wrong theme: an explicit choice (localStorage) wins, otherwise fall
    // back to the OS/browser preference -- see style.css's
    // :root[data-theme="dark"] override and the plain @media fallback.
    (function () {
      var stored = null;
      try { stored = localStorage.getItem("theme"); } catch (e) { /* storage blocked; fall through */ }
      var theme = stored === "light" || stored === "dark"
        ? stored
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  {% block body %}
  <div class="topbar">
    <div class="brand">AI Readiness Agent <small>local demo</small></div>
    <nav aria-label="Primary">
      <a href="{{ url_for('home') }}">Home</a>
      {% if user %}
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('logout') }}">Log out ({{ user }})</a>
      {% endif %}
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch between light and dark theme" aria-pressed="false">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <line x1="12" y1="2" x2="12" y2="4"></line>
          <line x1="12" y1="20" x2="12" y2="22"></line>
          <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
          <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
          <line x1="2" y1="12" x2="4" y2="12"></line>
          <line x1="20" y1="12" x2="22" y2="12"></line>
          <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
          <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </nav>
  </div>
  <main class="container" id="main-content">
    {% block content %}{% endblock %}
  </main>
  {% endblock %}

  <div id="loading-overlay" aria-hidden="true">
    <div class="loading-card">
      <div class="spinner"></div>
      <p>Working&hellip; real AWS calls can take a few seconds.</p>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
    </div>
  </div>

  <script>
    (function () {
      var toggle = document.getElementById("theme-toggle");
      if (toggle) {
        var syncPressed = function () {
          toggle.setAttribute("aria-pressed", document.documentElement.getAttribute("data-theme") === "dark");
        };
        syncPressed();
        toggle.addEventListener("click", function () {
          var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", next);
          try { localStorage.setItem("theme", next); } catch (e) { /* storage blocked; theme still applies this session */ }
          syncPressed();
        });
      }
    })();

    (function () {
      var overlay = document.getElementById("loading-overlay");

      // Show a loading overlay + disable the clicked submit button for any
      // POST form (login, save/delete connectors, run assessment actions) —
      // these can hit real S3/Comprehend/RDS/Anthropic calls that take a
      // few seconds, so give feedback instead of looking frozen, and guard
      // against double-submits.
      document.addEventListener("submit", function (evt) {
        var form = evt.target;
        if (form.tagName !== "FORM" || form.method.toLowerCase() !== "post") return;
        overlay.classList.add("visible");
        var submitter = evt.submitter;
        if (submitter) {
          setTimeout(function () {
            submitter.classList.add("is-loading");
            submitter.disabled = true;
          }, 0);
        }
      });

      // Progressive enhancement: animate each meter bar in from 0 on load
      // rather than appearing instantly. Skipped for reduced-motion users;
      // degrades to the existing static inline width with JS disabled.
      var reduceMotion = window.matchMedia
        && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!reduceMotion) {
        document.querySelectorAll(".meter-fill").forEach(function (el) {
          var target = el.style.width;
          if (!target) return;
          el.style.width = "0%";
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              el.style.transition = "width 0.6s cubic-bezier(.22,.61,.36,1)";
              el.style.width = target;
            });
          });
        });
      }
    })();
  </script>
</body>
</html>
